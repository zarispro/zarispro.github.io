    <script>
        document.addEventListener('DOMContentLoaded', () => {
    let currentPlayingMedia = null;

    const mediaElements = Array.from(document.querySelectorAll('audio, video'));

    mediaElements.forEach(media => {
        media.addEventListener('play', () => {
            if (currentPlayingMedia && currentPlayingMedia !== media) {
                currentPlayingMedia.pause();
            }
            currentPlayingMedia = media;
        });

        media.addEventListener('pause', () => {
            if (media === currentPlayingMedia) {
                currentPlayingMedia = null;
            }
        });

        media.addEventListener('ended', () => {
            if (media === currentPlayingMedia) {
                currentPlayingMedia = null;
            }
        });
    });
});
    </script>

    <script>
        // JavaScript for switching pages
        function showPage(page) {
            // Hide all page content
            const pages = document.querySelectorAll('.page-content');
            pages.forEach((pageContent) => {
                pageContent.classList.remove('active');
            });

            // Show the selected page content
            const selectedPage = document.getElementById(page);
            selectedPage.classList.add('active');

            // Highlight active button on sidebar
            const sidebarBtns = document.querySelectorAll('.sidebar-btn');
            sidebarBtns.forEach((btn) => {
                btn.classList.remove('active');
            });
            const activeSidebarBtn = document.getElementById(page + '-btn');
            if (activeSidebarBtn) activeSidebarBtn.classList.add('active');

            // Highlight active link in top nav
            const navLinks = document.querySelectorAll('.nav a');
            navLinks.forEach((link) => {
                link.classList.remove('active');
            });
            const activeNavLink = document.getElementById(page + '-btn');
            if (activeNavLink) activeNavLink.classList.add('active');
        }

        // Set the default page
        document.addEventListener('DOMContentLoaded', function () {
            showPage('character'); // 默认显示首页
        });
